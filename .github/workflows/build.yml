name: build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon runner (MLX needs arm64); macos-14 image was retired
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller==6.22.3
      - name: Build DMG
        env:
          PYTHON: python
        run: bash packaging/mac/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller==6.22.3
      - name: Fetch llama-server + uv
        shell: pwsh
        run: ./packaging/windows/fetch_vendor.ps1
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean --log-level WARN --distpath dist --workpath build packaging/tongchuan.spec
      - name: Smoke test (CLI exe starts and lists devices)
        shell: pwsh
        run: |
          $env:TONGCHUAN_HOME = "$env:RUNNER_TEMP\tc-home"
          & dist\TongChuan\TongChuanCLI.exe devices
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "import tongchuan; print(tongchuan.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Checksums for the in-app updater
        run: |
          mkdir -p rel && find out -type f \( -name '*.dmg' -o -name '*setup.exe' \) -exec cp {} rel/ \;
          cd rel && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
